<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Citation Checks</title>
    <link rel="stylesheet" href="/stylesheets/check.css" />
  </head>

  <body>
    <main>
      <h1 id="check-name"></h1>
      <p id="created"></p>
      <form id="check-rename-form">
        <label for="update-check-name">Update Citation Check Name</label>
        <input id="update-check-name" type="text" required maxlength="100" />
        <button type="submit">Update Name</button>
      </form>
      <ul id="dois"></ul>
      <form id="new-dois-form">
        <label for="new-dois">Add new DOIs here</label>
        <textarea
          id="new-dois"
          required
          placeholder="Paste DOIs, one per line"
        ></textarea>
        <button type="submit">Add DOIs</button>
      </form>
      <button id="run-check" type="button">Run Citation Check</button>
      <h2>Results</h2>
      <p id="message" role="status"></p>
      <ul id="check-results"></ul>
    </main>
    <script type="module" src="/javascripts/checkPage.js"></script>
  </body>
</html>
