<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Don't Cite Me! - Individual Citation Check</title>
    <link rel="stylesheet" href="/stylesheets/style.css" />
    <link rel="stylesheet" href="/stylesheets/check.css" />
  </head>

  <body>
    <header class="site-header">
      <a href="/" class="site-title">Don't Cite Me!</a>
      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/search.html">Browse Retractions</a>
        <a href="/checks.html" class="active">My Citation Checks</a>
        <a href="/article.html" id="add-retraction-link">Add Retraction</a>
        <a href="/flags-admin.html" id="flags-link">Flagged Records</a>
      </nav>
      <div class="header-actions">
        <button id="admin-btn" class="btn btn-dark" type="button">Admin</button>
      </div>
    </header>
    <main class="page">
      <div class="page-heading">
        <h2 id="check-name">My Citation Checks</h2>
        <p class="page-subtitle">
          Check your references against 60,000+ retractions.
        </p>
      </div>
      <p id="created"></p>
      <div class="field">
        <form id="check-rename-form" class="toolbar">
          <div class="field">
            <label for="update-check-name">Update Citation Check Name</label>
            <input
              id="update-check-name"
              type="text"
              required
              maxlength="100"
            />
          </div>
          <button type="submit" class="btn btn-primary">Update Name</button>
        </form>

        <ul id="dois"></ul>

        <form id="new-dois-form" class="toolbar">
          <div class="field">
            <label for="new-dois">Add new DOIs here</label>
            <textarea
              id="new-dois"
              required
              placeholder="Paste DOIs, one per line"
            ></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Add DOIs</button>
        </form>
      </div>
      <button id="run-check" type="button" class="btn btn-dark">
        Run Citation Check
      </button>
      <h2>Results</h2>
      <p id="message" role="status"></p>
      <ul id="check-results"></ul>
    </main>
    <script type="module" src="/javascripts/checkPage.js"></script>
  </body>
</html>
