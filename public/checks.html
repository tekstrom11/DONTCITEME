<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" , initial-scale=1" />
    <title> Citation Checks </title>
    <link rel="stylesheet" href="/stylesheets/checks.css" />
</head>

<body>
    <main>
        <h1> My Citation Checks </h1>
        <form id="new-check-form">
            <label for="check-name">Citation Check Name</label>
            <input id="check-name" type="text" required maxlength="100" />
            <button type="submit">Create Citation Check</button>
        </form>
        <p id="message" role="status"></p>
        <ul id="lists"></ul>
    </main>
    <script type="module" src="/javascripts/checksPage.js"></script>
</body>

</html>
